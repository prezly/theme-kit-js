name: Test

on: push

jobs:
  run-tests:
    name: Run tests (SDK ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['21.12.0', '23.0.1', '23.20.0', '26.16.0']

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Setup environment
        uses: prezly/setup-github-actions@v1
        with:
          pnpm: 9.15.4
          node: 22

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Select SDK version
        run: |
          node .github/scripts/sdk-version.cjs select ${{ matrix.sdk }}
          pnpm install --no-frozen-lockfile
          node .github/scripts/sdk-version.cjs verify ${{ matrix.sdk }}

      - name: Run tests (SDK ${{ matrix.sdk }})
        run: pnpm test

      - name: Check modified intl artifacts
        run: |
          files=$(git status --porcelain packages/intl/{i18n,src}/)
          if [[ $? != 0 ]]; then
            echo "Command failed." && false
          elif [[ $files ]]; then
            echo "Modified files detected." && false
          else
            echo "All good."
          fi
