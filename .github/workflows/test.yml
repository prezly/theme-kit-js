name: Test

on: push

jobs:
  run-tests:
    name: Run tests (SDK ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['24.0.0', '26.15.0']

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'

      - name: Cache node modules
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-build-${{ env.cache-name }}-sdk-${{ matrix.sdk }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install Node.js dependencies
        run: npm ci

      - name: Select SDK version
        run: npm install --no-save --package-lock=false @prezly/sdk@${{ matrix.sdk }}

      - name: Run tests
        run: npm test

      - name: Check modified intl artifacts
        run: |
          files=$(git status --porcelain packages/intl/{i18n,src}/)
          if [[ $? != 0 ]]; then
            echo "Command failed." && false
          elif [[ $files ]]; then
            echo "Modified files detected." && false
          else
            echo "All good."
          fi
